[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logbridge-color"
version = "0.1.0"
description = "LogBridge M1 log curves, WB CAT, and IDT pipeline (source of truth)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["color*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
